name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          uname -m

      - name: Build app
        run: |
          chmod +x Tools/build-app.sh
          ./Tools/build-app.sh

      - name: Package release
        id: package
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          fi
          zip="dist/DNSLeakGuard-${version}-macos-${arch}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/DNSLeakGuard.app" "$zip"
          (
            cd dist
            shasum -a 256 "$(basename "$zip")" > "$(basename "$zip").sha256"
          )
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"
          echo "sha=${zip}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "DNSLeakGuard-${{ steps.package.outputs.version }}-macos"
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${{ steps.package.outputs.zip }}" \
              "${{ steps.package.outputs.sha }}" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.package.outputs.zip }}" \
              "${{ steps.package.outputs.sha }}" \
              --title "DNS Leak Guard ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
